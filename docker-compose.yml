services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  livekit:
    image: livekit/livekit-server:v1.9.6
    command: ["--config", "/etc/livekit.yaml", "--dev"]
    volumes:
      - ./infra/local/livekit.yaml:/etc/livekit.yaml:ro
    network_mode: host
    depends_on:
      - redis
