substitutions:
  _REGION: europe-west4
  _REPOSITORY: rolecall-dev
  _TAG: manual

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.jobs
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/jobs:${_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/jobs:${_TAG}

options:
  logging: CLOUD_LOGGING_ONLY
