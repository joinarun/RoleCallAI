port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
redis:
  address: 127.0.0.1:6379
keys:
  replace-with-local-livekit-api-key: replace-with-local-livekit-secret-at-least-32-bytes
logging:
  level: info
room:
  auto_create: false
  empty_timeout: 120
  departure_timeout: 30
webhook:
  api_key: replace-with-local-livekit-api-key
  urls:
    - http://127.0.0.1:8000/v1/internal/livekit/webhook
