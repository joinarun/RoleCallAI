apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rolecall-worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rolecall-worker
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 8081
          protocol: TCP
        - port: 9090
          protocol: TCP
  egress:
    - {}
