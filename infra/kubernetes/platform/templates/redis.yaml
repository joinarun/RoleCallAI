apiVersion: v1
kind: Secret
metadata:
  name: rolecall-redis
  labels:
    app.kubernetes.io/name: rolecall-redis
    app.kubernetes.io/part-of: rolecallai
type: Opaque
stringData:
  password: {{ required "secrets.redisPassword is required" .Values.secrets.redisPassword | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rolecall-redis
  labels:
    app.kubernetes.io/name: rolecall-redis
    app.kubernetes.io/part-of: rolecallai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rolecall-redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rolecall-redis
        app.kubernetes.io/part-of: rolecallai
    spec:
      nodeSelector:
        rolecall-pool: workers
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4.5-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
            - --protected-mode
            - "yes"
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rolecall-redis
                  key: password
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rolecall-redis
  labels:
    app.kubernetes.io/name: rolecall-redis
    app.kubernetes.io/part-of: rolecallai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rolecall-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
