apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: livekit-signaling
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: {{ .Values.signalClass | quote }}
  tls:
    - hosts:
        - {{ .Values.signalHostname | quote }}
      secretName: livekit-signaling-tls
  rules:
    - host: {{ .Values.signalHostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.livekitService | quote }}
                port:
                  number: 7880
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-turn
  labels:
    app.kubernetes.io/part-of: rolecallai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: livekit-server
    app.kubernetes.io/instance: livekit
  ports:
    - name: turn-udp
      port: 3478
      targetPort: turn-udp
      protocol: UDP
    - name: turn-tls
      port: 5349
      targetPort: turn-tls
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: livekit-server
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: livekit-server
      app.kubernetes.io/instance: livekit
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: livekit-server
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: livekit-server
      app.kubernetes.io/instance: livekit
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
