apiVersion: v1
kind: Secret
metadata:
  name: livekit-credentials
  labels:
    app.kubernetes.io/part-of: rolecallai
type: Opaque
stringData:
  keys.yaml: |
    {{ required "secrets.livekitApiKey is required" .Values.secrets.livekitApiKey }}: {{ required "secrets.livekitApiSecret is required" .Values.secrets.livekitApiSecret }}
  api-key: {{ .Values.secrets.livekitApiKey | quote }}
  api-secret: {{ .Values.secrets.livekitApiSecret | quote }}
