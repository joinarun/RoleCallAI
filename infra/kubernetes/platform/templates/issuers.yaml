apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: rolecall-signal-letsencrypt
spec:
  acme:
    email: {{ .Values.acmeEmail | quote }}
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: rolecall-signal-letsencrypt-account
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .Values.signalClass | quote }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: rolecall-turn-letsencrypt
spec:
  acme:
    email: {{ .Values.acmeEmail | quote }}
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: rolecall-turn-letsencrypt-account
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .Values.turnClass | quote }}
